general:
  input_model:
    format: fm_netcdf
    reference_date: '1970-01-01'
    morfac: 1
inputs:
  data: ../sample-data/inlet_sedtrails.nc
  read_interval: 10D
  repeat_eulerian_fields: true
time:
  start: '2016-09-21 19:20:00'
  timestep: 60S
  duration: 1D
  cfl_condition: 0.7
particles:
  populations:
  - name: population_1
    particle_type: sand
    characteristics:
      grain_size: 0.00025
      density: 2650.0
    tracer_methods:
      vanwesten:
        flow_field_name:
        - bed_load_velocity
        - suspended_velocity
    transport_probability: stochastic_transport
    seeding:
      burial_depth:
        constant: 0
      release_start: '2016-09-21 19:30:00'
      quantity: 1
      strategy:
        file_points:
          path: ./sedtrails-example-seeded.points.txt
          has_header: false
          x_col: 0
          y_col: 1
          deduplicate: false
          dropna: false
          stride: 1
  - name: population_2
    particle_type: sand
    characteristics:
      grain_size: 0.00025
      density: 2650.0
    tracer_methods:
      vanwesten:
        flow_field_name:
        - bed_load_velocity
        - suspended_velocity
    transport_probability: stochastic_transport
    seeding:
      burial_depth:
        constant: 0
      release_start: '2016-09-21 19:30:00'
      quantity: 1
      strategy:
        random:
          bbox: 39400,16800 40600,17800
          seed: 42
          nlocations: 5
outputs:
  directory: ./results
  store_tracks: true
  save_interval: 1H
visualization:
  dashboard:
    enable: false
    update_interval: 1H
